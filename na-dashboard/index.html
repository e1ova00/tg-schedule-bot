<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="N.A. — персональный дашборд тренировок, восстановления, самочувствия и питания. Учебный проект на чистом JavaScript." />
    <meta name="theme-color" content="#f2f2f7" />
    <title>N.A. · Fitness &amp; Wellbeing</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff6b2c'/%3E%3Cstop offset='1' stop-color='%23ff2d6f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='42' font-family='-apple-system,Helvetica,Arial' font-size='26' font-weight='700' text-anchor='middle' fill='white'%3EN.A%3C/text%3E%3C/svg%3E" />
    <script>
      // Применяем сохранённую тему до отрисовки, чтобы не было «вспышки» светлой темы.
      (function () {
        try {
          var prefs = JSON.parse(localStorage.getItem('na.preferences') || '{}');
          var mode = prefs.theme || 'light';
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="styles/variables.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/layout.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/widgets.css" />
    <link rel="stylesheet" href="styles/responsive.css" />
    <!-- Chart.js 4 (MIT) — локальная копия, работает без CDN. -->
    <script src="vendor/chart.umd.min.js" defer></script>
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>

    <div class="app">
      <header class="topbar">
        <a class="brand" href="#/today" aria-label="N.A. — на главную">
          <span class="brand__mark" aria-hidden="true">N.A.</span>
        </a>
        <button type="button" class="icon-btn" data-open-settings aria-label="Профиль и настройки">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
        </button>
      </header>

      <nav class="sidebar" aria-label="Разделы">
        <a class="brand brand--sidebar" href="#/today" aria-label="N.A. — на главную">
          <span class="brand__mark" aria-hidden="true">N.A.</span>
          <span class="brand__text">Fitness &amp; Wellbeing</span>
        </a>
        <ul class="nav-list" id="nav-list"></ul>
        <div class="sidebar__footer">
          <div class="theme-switch" id="theme-switch" role="group" aria-label="Тема оформления"></div>
          <button type="button" class="btn btn--ghost sidebar__settings" data-open-settings>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
            <span>Профиль и настройки</span>
          </button>
        </div>
      </nav>

      <main class="main" id="main" tabindex="-1">
        <noscript>
          <p class="noscript">Для работы N.A. нужен JavaScript. Откройте сайт в современном браузере.</p>
        </noscript>
      </main>
    </div>

    <div id="live-region" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
