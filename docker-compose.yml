# Как бот живёт на сервере. Сервис ровно один — сам бот.
# Портов нет и не нужно: бот сам ходит в Telegram (long polling), входящих
# подключений извне он не принимает.
#
# Запуск:     docker compose up -d --build
# Логи:       docker compose logs -f
# Остановка:  docker compose down
# Подробности — в docs/DEPLOY.md.

services:
  bot:
    build: .
    image: tg-schedule-bot
    container_name: tg-schedule-bot

    # Все секреты (токен бота, ключи 2ГИС) — только здесь, в файле .env рядом
    # с этим файлом. В git .env не попадает. Если .env нет, compose честно ругнётся.
    env_file: .env

    environment:
      # Часовой пояс задан жёстко и здесь, а не только в .env: на нём держится
      # время в логах и срабатывание утренних задач APScheduler. Значение из
      # environment сильнее значения из env_file, так что зона не потеряется,
      # даже если строку TZ в .env случайно сотрут.
      TZ: Europe/Moscow

    volumes:
      # База и логи лежат на сервере, а не внутри контейнера: переживают любую
      # пересборку образа и видны обычными командами, без захода внутрь контейнера.
      - ./data:/app/data
      - ./logs:/app/logs

    # Бот поднимается сам после перезагрузки сервера и после падения.
    # unless-stopped, а не always: если вы осознанно сделали docker compose down,
    # бот не воскреснет сам собой.
    restart: unless-stopped

    # Нормальный процесс №1 внутри контейнера. Без него «docker compose down»
    # не может вежливо попросить бота завершиться и молча ждёт 10 секунд таймаута.
    init: true

    # Чтобы вывод бота не съел диск за полгода работы: 3 файла по 10 МБ.
    # Свой собственный лог бот всё равно пишет в logs/bot.log и там тоже ротирует.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
